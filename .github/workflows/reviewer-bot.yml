name: Suggest Reviewers

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  suggest-reviewers:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for analysis

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install RepoGraph
        run: pip install .

      - name: Analyze repository
        run: |
          repograph analyze . --max-commits 2000
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379

      - name: Get changed files
        id: changed
        run: |
          FILES=$(gh pr view ${{ github.event.pull_request.number }} --json files -q '.files[].path' | head -10)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate reviewer suggestions
        id: suggest
        run: |
          COMMENT="## 👀 Suggested Reviewers\n\nBased on RepoGraph knowledge analysis of git history:\n\n"
          HAS_CONTENT=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            REVIEWERS=$(python3 -c "
          from repograph.core.config import FalkorDBConfig
          from repograph.core.database import DatabaseManager
          from repograph.core.queries import query_reviewers
          db = DatabaseManager(FalkorDBConfig())
          db.connect()
          results = query_reviewers(db, '$file', limit=3)
          for r in results:
              print(f'  - **{r.name}** ({r.score:.1f} score, {r.commit_count} commits)')
          db.close()
          " 2>/dev/null)

            if [ -n "$REVIEWERS" ]; then
              COMMENT+="### \`$file\`\n$REVIEWERS\n\n"
              HAS_CONTENT=true
            fi
          done <<< "${{ steps.changed.outputs.files }}"

          COMMENT+="---\n*Generated by [RepoGraph](https://github.com/FalkorDB/RepoGraph) 📊*"

          echo -e "$COMMENT" > /tmp/repograph-comment.md
          echo "has_content=$HAS_CONTENT" >> $GITHUB_OUTPUT
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: 6379

      - name: Post comment
        if: steps.suggest.outputs.has_content == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/repograph-comment.md', 'utf8');
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.data.find(c =>
              c.body.includes('Generated by [RepoGraph]')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
